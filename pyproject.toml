[project]
name = "kris"
version = "0.1.0"
description = "Personal data intelligence — index, analyze, and query your files"
readme = "README.md"
authors = [
    { name = "Ken Hiatt", email = "ken.hiatt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=14",
    "opensearch-py>=3.0",
    "sentence-transformers>=4",
    "llama-cpp-python>=0.3",
    "tree-sitter>=0.24",
    "charset-normalizer>=3",
    "tomlkit>=0.13",
]

[project.scripts]
kris = "kris.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
