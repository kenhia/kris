[package]
name = "kris-scanner"
version = "0.1.0"
edition = "2024"
description = "Filesystem scanner for kris — walks directories, classifies files, hashes content, writes to SQLite"

[dependencies]
walkdir = "2"
globset = "0.4"
sha2 = "0.10"
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
